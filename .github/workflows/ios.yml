name: Build IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Créer le projet Expo
        run: |
          npx create-expo-app@latest app --template blank --no-install
          cp App.js songs.js app/
          cd app
          npm install
          npx expo install expo-audio expo-file-system
          node -e "const f=require('fs');const j=JSON.parse(f.readFileSync('app.json'));j.expo.name='MagicPiano';j.expo.slug='MagicPiano';j.expo.ios={...j.expo.ios,bundleIdentifier:'com.toi.magicpiano'};f.writeFileSync('app.json',JSON.stringify(j,null,2))"
          npx expo prebuild -p ios
      - name: Compiler
        run: |
          cd app/ios
          xcodebuild -workspace MagicPiano.xcworkspace -scheme MagicPiano -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          mkdir Payload && cp -r build/Build/Products/Release-iphoneos/MagicPiano.app Payload/
          zip -r ../../MagicPiano.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: MagicPiano-ipa, path: MagicPiano.ipa }
